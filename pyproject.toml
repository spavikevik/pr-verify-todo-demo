[project]
name = "todo-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "pydantic==2.9.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "coverage==7.6.4",
    "httpx==0.27.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
relative_files = true
