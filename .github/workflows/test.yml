name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run coverage run -m pytest --junitxml=reports/junit.xml
      - run: uv run coverage xml -o reports/coverage.xml
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
